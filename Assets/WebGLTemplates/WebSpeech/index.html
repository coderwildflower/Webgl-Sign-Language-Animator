<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Unity WebGL – Viseme Sender</title>
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>

    <!-- Unity WebGL Loader Script (usually auto-generated by Unity) -->
  <script src="Build/UnityLoader.js"></script>
  <script>
    // Initialize Unity WebGL build
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/YourWebGLBuild.json");
    
    // Message handler for Unity communication
    function RegisterMessageHandler() {
        window.addEventListener('message', function(event) {
            // Handle callUnity messages (like "Microphone Enabled")
            if (event.data.type === 'callUnity') {
                if (gameInstance.SendMessage) {
                    gameInstance.SendMessage('WebGLMessageReceiver', event.data.method, event.data.param);
                }
            }
        });
    }
    
    // Call this when Unity is ready
    function onUnityReady() {
        RegisterMessageHandler();
        log("Unity is ready - message handler registered");
    }
  </script>
</head>

<body>
  <button onclick="sendToUnity()">Send Message to Unity</button>
  <h2>Azure Speech SDK – Text to Visemes</h2>
  <input id="textInput" type="text" value="Hello, how are you doing today?" style="width:300px;" />
  <button id="speakBtn">Speak & Send Visemes</button>
  <pre id="log" style="background:#f0f0f0; padding:10px; height:200px; overflow:auto;"></pre>

  <!-- <iframe id="unity-iframe" src="https://signlanguagewebgl.netlify.app/" width="960" height="600" allow="microphone"></iframe> -->
  <iframe id="unity-iframe" src="../WebGLBuild/index.html" width="960" height="600" allow="microphone"></iframe>

  <script>
    const speechKey = "";
    const speechRegion = "";

    const logElement = document.getElementById("log");
    function log(msg) {
      console.log(msg);
      logElement.textContent += msg + "\n";
    }

    function sendToUnity() {
      const iframe = document.getElementById("unity-iframe");
      iframe.contentWindow.postMessage(
        { type: "callUnity", method: "ReceiveMessage", param: "Microphone Enabled" },
        "*"
      );
    }

    function sendVisemesToUnity(visemeArray) {
      const iframe = document.getElementById("unity-iframe");
      iframe.contentWindow.postMessage(
        { type: "visemeData", data: visemeArray },
        "*"
      );
      log("Sent visemes to Unity");
    }

    document.getElementById("speakBtn").onclick = () => {
      const text = document.getElementById("textInput").value;

      const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(speechKey, speechRegion);
      speechConfig.speechSynthesisVoiceName = "en-US-AriaNeural";

      const synthesizer = new SpeechSDK.SpeechSynthesizer(speechConfig, null);

      let visemeTimeline = [];

      synthesizer.visemeReceived = (s, e) => {
        const time = (e.audioOffset / 10000).toFixed(0); // ms
        visemeTimeline.push({ visemeId: e.visemeId, time: parseInt(time) });
        log(`Viseme ID: ${e.visemeId}, Time: ${time} ms`);
      };

      synthesizer.speakTextAsync(
        text,
        result => {
          if (result.reason === SpeechSDK.ResultReason.SynthesizingAudioCompleted) {
            log(" Viseme extraction finished.");
            sendVisemesToUnity(visemeTimeline);
          } else {
            log(" Error: " + result.errorDetails);
          }
          synthesizer.close();
        },
        err => {
          log(" " + err);
          synthesizer.close();
        }
      );
    };
  </script>
</body>
</html>
